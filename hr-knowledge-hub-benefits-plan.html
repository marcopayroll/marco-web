<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="assets/marco-favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Benefits — Global Benefits Plan</title>
<style>
@import url('assets/fonts/euclid-circular-b.css');

:root {
  --navy: #0a1628;
  --navy-mid: #102040;
  --navy-light: #1a3055;
  --blue-bright: #2e7dd1;
  --blue-glow: #4a9eff;
  --white: #ffffff;
  --off-white: #f0f4f8;
  --text-muted: #8aa0b8;
  --border: #1e3a5f;
  --sb-pad-x: 16px;
  --sb-code-w: 34px;
  --sb-full-w: 280px;
  --sb-collapsed-w: 56px;
  --banner-h: 90px;
  --filter-h: 53px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Euclid Circular B', sans-serif;
  background: var(--off-white);
  color: #1a2a3a;
  display: flex; flex-direction: column;
}

/* ══ BANNER ══ */
.banner {
  background: var(--navy);
  position: relative; overflow: hidden;
  padding: 0 24px; height: var(--banner-h);
  flex-shrink: 0;
  display: flex; align-items: center;
}
.banner::before {
  content: ''; position: absolute; right: -60px; top: -60px;
  width: 280px; height: 280px; border-radius: 50%;
  border: 1.5px solid rgba(74,158,255,0.12);
  box-shadow: 0 0 0 28px rgba(74,158,255,0.04), 0 0 0 56px rgba(74,158,255,0.03);
  pointer-events: none;
}
.banner-left { display: flex; align-items: center; gap: 16px; z-index: 1; min-width: 0; }
.banner-logo { height: 44px; width: auto; display: block; flex-shrink: 0; }
.banner-divider { width: 1px; height: 32px; background: rgba(255,255,255,0.2); flex-shrink: 0; }
.banner-text { min-width: 0; }
.banner-title { font-size: 17px; font-weight: 700; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner-subtitle { font-size: 11px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ══ FILTER BAR ══ */
.filter-bar {
  background: var(--navy-mid);
  border-bottom: 1px solid var(--border);
  padding: 0 16px; height: var(--filter-h);
  flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
}
.btn-hamburger {
  display: none;
  align-items: center; justify-content: center;
  width: 36px; height: 36px; flex-shrink: 0;
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--border); border-radius: 8px;
  color: var(--white); font-size: 16px; cursor: pointer;
  transition: background 0.2s;
}
.btn-hamburger:hover { background: rgba(255,255,255,0.14); }
.filter-label {
  font-size: 11px; font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;
}
.search-wrap { position: relative; flex: 1; min-width: 0; max-width: 300px; }
.search-icon {
  position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%);
  width: 16px; height: 16px; pointer-events: none;
  color: var(--text-muted);
}
.search-input {
  width: 100%; padding: 8px 10px 8px 32px;
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--border); border-radius: 8px;
  color: var(--white); font-size: 13px;
  font-family: 'Euclid Circular B', sans-serif;
  outline: none; transition: border-color 0.2s, background 0.2s;
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--blue-bright); background: rgba(255,255,255,0.1); }
.select-wrap { position: relative; flex-shrink: 0; min-width: 150px; }
.select-wrap select {
  width: 100%; padding: 8px 28px 8px 11px;
  background: rgba(255,255,255,0.07);
  border: 1px solid var(--border); border-radius: 8px;
  color: var(--white); font-size: 13px;
  font-family: 'Euclid Circular B', sans-serif;
  appearance: none; cursor: pointer; outline: none;
}
.select-wrap select option { background: #1a2a3a; color: #fff; }
.select-wrap select:focus { border-color: var(--blue-bright); }
.select-wrap::after {
  content: '▾'; position: absolute; right: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted); pointer-events: none; font-size: 12px;
}
.btn-clear {
  padding: 8px 14px; flex-shrink: 0;
  background: rgba(255,60,60,0.12);
  border: 1px solid rgba(255,60,60,0.25); border-radius: 8px;
  color: #ff8888; font-size: 12px; font-weight: 600;
  font-family: 'Euclid Circular B', sans-serif;
  cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.btn-clear:hover { background: rgba(255,60,60,0.22); color: #ffbbbb; }
.btn-clear .clear-icon { display: none; }

/* ══ LAYOUT ══ */
.layout { display: flex; flex: 1; overflow: hidden; position: relative; }

/* ══ SIDEBAR ══ */
.sidebar {
  width: var(--sb-full-w); min-width: var(--sb-full-w);
  background: var(--navy);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
  transition: width 0.25s ease, min-width 0.25s ease;
  flex-shrink: 0; z-index: 10;
}
.sidebar-header {
  padding: 11px var(--sb-pad-x);
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: var(--navy-mid); flex-shrink: 0;
  overflow: hidden;
}
.sidebar-header-text {
  font-size: 10px; font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 1.2px;
  white-space: nowrap; overflow: hidden;
  transition: opacity 0.2s;
}
.btn-sb-toggle {
  display: none;
  align-items: center; justify-content: center;
  flex-shrink: 0;
  background: transparent; border: none;
  color: var(--text-muted); cursor: pointer;
  padding: 6px; transition: color 0.2s;
}
.btn-sb-toggle:hover { color: var(--white); }
.sidebar-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; }
.sidebar-scroll::-webkit-scrollbar { width: 4px; }
.sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
.sidebar-scroll::-webkit-scrollbar-thumb { background: rgba(74,158,255,0.2); border-radius: 2px; }
.sb-row {
  display: flex; align-items: center;
  padding: 9px var(--sb-pad-x);
  border-left: 3px solid transparent;
  cursor: pointer;
  transition: background 0.13s, border-color 0.13s;
  user-select: none; gap: 8px;
}
.sb-row:hover { background: rgba(74,158,255,0.09); }
.sb-row.active { background: rgba(46,125,209,0.16); border-left-color: var(--blue-bright); }
.sb-code {
  width: var(--sb-code-w); flex-shrink: 0;
  font-size: 10.5px; font-weight: 700;
  color: #8aa0b8; letter-spacing: 0.8px;
  font-family: 'Euclid Circular B', sans-serif;
  text-align: left; line-height: 1;
}
.sb-label {
  flex: 1; font-size: 13px; font-weight: 500;
  color: #b8cce0; line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  min-width: 0; transition: opacity 0.2s, max-width 0.2s;
}
.sb-row:hover .sb-label { color: var(--white); }
.sb-row.active .sb-label { color: var(--white); font-weight: 600; }
.sb-row.accordion-trigger .sb-label { font-weight: 600; color: var(--white); }
.sb-chevron {
  font-size: 9px; color: var(--text-muted);
  transition: transform 0.2s, opacity 0.2s; flex-shrink: 0; margin-left: 2px;
}
.sb-row.accordion-trigger.open .sb-chevron { transform: rotate(180deg); }
.sb-profiles {
  font-size: 10px; color: var(--text-muted);
  font-family: 'Euclid Circular B', sans-serif;
  flex-shrink: 0; white-space: nowrap; transition: opacity 0.2s;
}
.sb-badge {
  font-size: 10.5px;
  background: rgba(74,158,255,0.12);
  color: var(--text-muted);
  padding: 2px 7px; border-radius: 8px;
  font-family: 'Euclid Circular B', sans-serif;
  flex-shrink: 0; transition: opacity 0.2s;
}
.sb-row.active .sb-badge { background: rgba(46,125,209,0.3); color: var(--blue-glow); }
.accordion-item { border-bottom: 1px solid rgba(255,255,255,0.03); }
.accordion-panel { display: none; background: rgba(0,0,0,0.22); border-top: 1px solid rgba(74,158,255,0.07); }
.accordion-panel.open { display: block; }
.sb-row.sub-item { padding-top: 7px; padding-bottom: 7px; }
.sb-row.sub-item .sb-label { font-size: 12.5px; font-weight: 400; color: #94b0c8; }
.sb-row.sub-item:hover .sb-label { color: var(--white); font-weight: 500; }
.sb-row.sub-item.active .sb-label { color: var(--white); font-weight: 600; }
.sidebar-empty { padding: 30px var(--sb-pad-x); text-align: center; color: var(--text-muted); font-size: 13px; }

/* ══ MOBILE OVERLAY ══ */
.sidebar-overlay {
  display: none; position: fixed; inset: 0; z-index: 30;
  background: rgba(0,0,0,0.55); backdrop-filter: blur(2px);
}
.sidebar-overlay.active { display: block; }

/* ══ MAIN CONTENT ══ */
.main {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 24px 28px; background: var(--off-white);
}
.main::-webkit-scrollbar { width: 6px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: rgba(0,30,80,0.18); border-radius: 3px; }
.welcome-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 60vh; text-align: center; color: var(--text-muted);
  padding: 20px;
}
.welcome-state .big-icon { font-size: 48px; margin-bottom: 14px; opacity: 0.6; }
.welcome-state h2 { font-size: 20px; font-weight: 600; color: #3a5070; margin-bottom: 8px; }
.welcome-state p { font-size: 14px; max-width: 360px; line-height: 1.6; }

/* ══ DETAIL HEADER ══ */
.detail-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 20px; padding-bottom: 16px;
  border-bottom: 2px solid #dde5ef;
  flex-wrap: wrap; gap: 12px;
}
.detail-header h1 { font-size: 22px; font-weight: 700; color: #0e2040; line-height: 1.3; }
.detail-header .meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.benefit-count {
  background: var(--navy); color: var(--blue-glow);
  padding: 8px 16px; border-radius: 20px;
  font-size: 20px; font-weight: 700;
  font-family: 'Euclid Circular B', sans-serif;
  text-align: center; flex-shrink: 0;
}
.benefit-count span { display: block; font-size: 10px; font-weight: 500; color: var(--text-muted); margin-top: 1px; }

/* ══ CATEGORY FILTER PILLS ══ */
.cat-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
.cat-pill {
  padding: 5px 13px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
  cursor: pointer; border: 1px solid #c8d8e8;
  background: #e0e8f0; color: #3a5070;
  transition: all 0.15s; user-select: none;
}
.cat-pill:hover { background: #ccd8e8; color: #1a2a3a; }
.cat-pill.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

/* ══ CATEGORY GROUP ══ */
.cat-group { margin-bottom: 28px; }
.cat-group-label {
  font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 2px;
  color: #6080a0; margin-bottom: 10px;
  padding-bottom: 6px; border-bottom: 1px solid #dde5ef;
}

/* ══ BENEFIT CARD ══ */
.benefit-card {
  background: var(--white);
  border: 1px solid #e8eef4;
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 8px;
  transition: box-shadow 0.15s, border-color 0.15s;
}
.benefit-card:hover { box-shadow: 0 2px 10px rgba(0,30,80,0.09); border-color: #c0d4e8; }
.benefit-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px; margin-bottom: 10px;
}
.benefit-name {
  font-size: 14px; font-weight: 600; color: #1a2a3a; flex: 1; line-height: 1.4;
}
.mandatory-tag {
  font-size: 10.5px; font-weight: 700;
  padding: 3px 9px; border-radius: 10px;
  white-space: nowrap; flex-shrink: 0; letter-spacing: 0.2px;
}
.tag-m-yes    { background: #e4f5ec; color: #1a5c3a; }
.tag-m-no     { background: #e8eef4; color: #4a6070; }
.tag-m-cond   { background: #fff0e8; color: #7c3a1a; }
.tag-m-case   { background: #f5e8ff; color: #5a1a7a; }
.tag-m-juris  { background: #e4f0fa; color: #1a4a6a; }
.benefit-details {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px;
}
.detail-block {}
.detail-full { grid-column: 1 / -1; }
.detail-label {
  font-size: 9.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.8px;
  color: #9ab0c8; margin-bottom: 3px;
}
.detail-value {
  font-size: 13px; color: #2a3a4a; line-height: 1.55;
}
.compliance-note {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid #eef2f6;
  font-size: 12px; color: #6a8098; line-height: 1.55;
}
.compliance-note strong { color: #4a6a88; font-weight: 600; }
.benefit-footer {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid #eef2f6;
  font-size: 12px; color: #6a8098; line-height: 1.55;
  display: flex; flex-direction: column; gap: 6px;
}
.benefit-summary { color: #4a6070; font-style: italic; }
.benefit-sources a { color: #2e7dd1; text-decoration: none; }
.benefit-sources a:hover { text-decoration: underline; }
.benefit-verified { color: #9ab0c8; font-size: 11px; }
.relationship-badge {
  display: inline-block; align-self: flex-start;
  font-size: 10.5px; font-weight: 700;
  padding: 3px 9px; border-radius: 10px; letter-spacing: 0.2px;
}
.badge-national { background: #e4f0fa; color: #1a4a6a; }
.badge-local { background: #fff0e8; color: #7c3a1a; }
.no-results { text-align: center; padding: 48px 20px; color: var(--text-muted); font-size: 14px; }

/* ══ TABLET ══ */
@media (max-width: 1024px) and (min-width: 600px) {
  .btn-sb-toggle { display: flex; }
  .filter-label { display: none; }
  .sidebar { width: var(--sb-collapsed-w); min-width: var(--sb-collapsed-w); }
  .sidebar-header-text { opacity: 0; width: 0; overflow: hidden; }
  .sidebar .sidebar-header { justify-content: center; }
  .sidebar .sb-label, .sidebar .sb-badge, .sidebar .sb-profiles, .sidebar .sb-chevron { display: none !important; }
  .sidebar .sb-code { width: var(--sb-collapsed-w) !important; text-align: center !important; font-size: 11px; }
  .sidebar .sb-row { padding: 11px 0 !important; border-left: none !important; gap: 0; }
  .sidebar .accordion-panel { display: none !important; }
  .sidebar.expanded { width: var(--sb-full-w); min-width: var(--sb-full-w); }
  .sidebar.expanded .sidebar-header { justify-content: space-between; }
  .sidebar.expanded .sidebar-header-text { opacity: 1; width: auto; }
  .sidebar.expanded .sb-label { display: block !important; }
  .sidebar.expanded .sb-badge, .sidebar.expanded .sb-profiles, .sidebar.expanded .sb-chevron { display: flex !important; opacity: 1; width: auto; }
  .sidebar.expanded .sb-code { width: var(--sb-code-w) !important; text-align: left !important; font-size: 10.5px; }
  .sidebar.expanded .sb-row { padding: 9px var(--sb-pad-x) !important; border-left: 3px solid transparent !important; gap: 8px; }
  .sidebar.expanded .sb-row.active { border-left-color: var(--blue-bright) !important; }
  .sidebar.expanded .accordion-panel.open { display: block !important; }
  .benefit-details { grid-template-columns: 1fr; }
}

/* ══ MOBILE ══ */
@media (max-width: 599px) {
  :root { --filter-h: 52px; }
  .banner { padding: 12px 16px; height: auto; align-items: flex-start; }
  .banner-logo { height: 32px; margin-top: 2px; }
  .banner-divider { height: 26px; margin-top: 4px; }
  .banner-title { font-size: 13px; white-space: normal; line-height: 1.35; }
  .banner-subtitle { font-size: 10.5px; white-space: normal; line-height: 1.45; margin-top: 3px; }
  .btn-hamburger { display: flex; }
  .filter-label { display: none; }
  .btn-clear .clear-text { display: none; }
  .btn-clear .clear-icon { display: inline; }
  .btn-clear { padding: 0; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }
  .filter-bar { gap: 8px; padding: 0 12px; }
  .search-wrap { flex: 1; min-width: 0; max-width: none; }
  .search-input { font-size: 12px; padding: 7px 8px 7px 28px; }
  .select-wrap { width: 110px; min-width: 0; }
  .select-wrap select { font-size: 12px; padding: 7px 22px 7px 8px; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: min(85vw, 300px); min-width: 0; z-index: 40;
    transform: translateX(-110%);
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 4px 0 32px rgba(0,0,0,0.4);
  }
  .sidebar.mobile-open { transform: translateX(0); }
  .btn-sb-toggle { display: flex; }
  .main { padding: 16px; }
  .detail-header h1 { font-size: 18px; }
  .benefit-details { grid-template-columns: 1fr; }
  .benefit-card { padding: 12px 14px; }
}
</style>
</head>
<body>

<!-- BANNER -->
<div class="banner">
  <div class="banner-left">
    <a href="index.html"><img class="banner-logo" src="https://marcowallpaper.s3.ap-southeast-1.amazonaws.com/Marco+logo+white+(tall).png" alt="Marco"></a>
    <div class="banner-divider"></div>
    <div class="banner-text">
      <div class="banner-title" data-i18n="bp.banner.title">Global Employee Benefits Plan</div>
      <div class="banner-subtitle" data-i18n="bp.banner.subtitle">Statutory obligations, employer costs &amp; compliance notes</div>
    </div>
  </div>
</div>

<!-- FILTER BAR -->
<div class="filter-bar">
  <button class="btn-hamburger" id="btnMobileOpen" onclick="mobileOpenDrawer()" aria-label="Open menu">&#9776;</button>
  <span class="filter-label" data-i18n="bp.filter.label">FILTER</span>
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M21 21L16.65 16.65M19 11C19 15.4183 15.4183 19 11 19C6.58172 19 3 15.4183 3 11C3 6.58172 6.58172 3 11 3C15.4183 3 19 6.58172 19 11Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <input type="text" class="search-input" id="sidebarSearch" placeholder="Search country..." data-i18n-placeholder="bp.search.placeholder" oninput="filterSidebar()">
  </div>
  <div class="select-wrap">
    <select id="regionFilter" onchange="filterSidebar()">
      <option value="" data-i18n="bp.region.all">All Regions</option>
      <option value="Africa" data-i18n="bp.region.Africa">Africa</option>
      <option value="Americas" data-i18n="bp.region.Americas">Americas</option>
      <option value="Asia Pacific" data-i18n="bp.region.Asia">Asia Pacific</option>
      <option value="Europe" data-i18n="bp.region.Europe">Europe</option>
      <option value="Middle East" data-i18n="bp.region.Middle_East">Middle East</option>
    </select>
  </div>
  <button class="btn-clear" onclick="clearFilters()"><span class="clear-text" data-i18n="bp.filter.clear">&#10005; Clear</span><span class="clear-icon">&#10005;</span></button>
</div>

<!-- LAYOUT -->
<div class="layout">
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="mobileCloseDrawer()"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-header-text" data-i18n="bp.sidebar.header">SELECT A COUNTRY</span>
      <button class="btn-sb-toggle" id="btnSbToggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M2 8H14M2 4H14M2 12H14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
    <div class="sidebar-scroll" id="countryList"></div>
  </div>
  <div class="main" id="mainContent">
    <div class="welcome-state">
      <div class="big-icon">&#127775;</div>
      <h2 data-i18n="bp.welcome.title">Select a country to view its employee benefits</h2>
      <p data-i18n="bp.welcome.body">Choose any country or state from the left panel. You can search by name, filter by region, or browse by benefit category once selected.</p>
    </div>
  </div>
</div>

<script src="assets/HR Knowledge Hub/Benefits Plan/benefits-data.js"></script>
<script>

const REGION_MAP = {
  'Argentina':'Americas','Brazil':'Americas','Canada':'Americas','Chile':'Americas',
  'Colombia':'Americas','Costa Rica':'Americas','Peru':'Americas','United States':'Americas','Uruguay':'Americas',
  'Australia':'Asia Pacific','Bangladesh':'Asia Pacific','Cambodia':'Asia Pacific','China':'Asia Pacific',
  'Hong Kong':'Asia Pacific','India':'Asia Pacific','Indonesia':'Asia Pacific','Japan':'Asia Pacific',
  'Laos':'Asia Pacific','Myanmar':'Asia Pacific','Nepal':'Asia Pacific','New Zealand':'Asia Pacific',
  'Pakistan':'Asia Pacific','Philippines':'Asia Pacific','Singapore':'Asia Pacific','South Korea':'Asia Pacific',
  'Sri Lanka':'Asia Pacific','Taiwan':'Asia Pacific','Thailand':'Asia Pacific','Vietnam':'Asia Pacific','Lithuania':'Europe','Luxembourg':'Europe','Malaysia':'Asia Pacific','Malta':'Europe','Mexico':'Americas',
  'Austria':'Europe','Belgium':'Europe','Bulgaria':'Europe','Croatia':'Europe','Cyprus':'Europe',
  'Czech Republic':'Europe','Denmark':'Europe','Estonia':'Europe','Finland':'Europe','France':'Europe',
  'Germany':'Europe','Greece':'Europe','Hungary':'Europe','Iceland':'Europe','Ireland':'Europe',
  'Italy':'Europe','Latvia':'Europe','Netherlands':'Europe','Norway':'Europe','Poland':'Europe',
  'Portugal':'Europe','Romania':'Europe','Serbia':'Europe','Slovakia':'Europe','Slovenia':'Europe',
  'Spain':'Europe','Sweden':'Europe','Switzerland':'Europe','Turkey':'Europe','Ukraine':'Europe',
  'United Kingdom':'Europe',
  'Bahrain':'Middle East','Israel':'Middle East','Jordan':'Middle East','Kuwait':'Middle East',
  'Oman':'Middle East','Qatar':'Middle East','Saudi Arabia':'Middle East','United Arab Emirates':'Middle East',
  'Egypt':'Africa','Ghana':'Africa','Kenya':'Africa','Mauritius':'Africa',
  'Morocco':'Africa','Nigeria':'Africa','South Africa':'Africa'
};

const ISO_MAP = {
  'Argentina':'AR','Australia':'AU','Austria':'AT','Bahrain':'BH','Bangladesh':'BD',
  'Belgium':'BE','Brazil':'BR','Bulgaria':'BG','Cambodia':'KH','Canada':'CA',
  'Chile':'CL','China':'CN','Colombia':'CO','Costa Rica':'CR','Croatia':'HR',
  'Cyprus':'CY','Czech Republic':'CZ','Denmark':'DK','Egypt':'EG','Estonia':'EE',
  'Finland':'FI','France':'FR','Germany':'DE','Ghana':'GH','Greece':'GR',
  'Hong Kong':'HK','Hungary':'HU','Iceland':'IS','India':'IN','Indonesia':'ID',
  'Ireland':'IE','Israel':'IL','Italy':'IT','Japan':'JP','Jordan':'JO',
  'Kenya':'KE','Kuwait':'KW','Laos':'LA','Latvia':'LV','Mauritius':'MU',
  'Morocco':'MA','Myanmar':'MM','Nepal':'NP','Netherlands':'NL','New Zealand':'NZ',
  'Nigeria':'NG','Norway':'NO','Oman':'OM','Pakistan':'PK','Peru':'PE',
  'Philippines':'PH','Poland':'PL','Portugal':'PT','Qatar':'QA','Romania':'RO',
  'Saudi Arabia':'SA','Serbia':'RS','Singapore':'SG','Slovakia':'SK','Slovenia':'SI',
  'South Africa':'ZA','South Korea':'KR','Spain':'ES','Sri Lanka':'LK','Sweden':'SE',
  'Switzerland':'CH','Taiwan':'TW','Thailand':'TH','Turkey':'TR','United Arab Emirates':'AE',
  'Ukraine':'UA','United Kingdom':'GB','United States':'US','Uruguay':'UY','Vietnam':'VN','Lithuania':'LT','Luxembourg':'LU','Malaysia':'MY','Malta':'MT','Mexico':'MX'
};

const PARENT_NAMES = {'UAE':'United Arab Emirates'};
const PARENT_NAMES_CN = {'United States':'美国','United Arab Emirates':'阿联酋','Australia':'澳大利亚','Canada':'加拿大','China':'中国','Germany':'德国','India':'印度'};

let currentKey = null;
let currentBroadCat = 'all';
const openGroups = new Set();

var ALL_KEYS = Object.keys(BENEFITS);

function bpT(key, fallback) {
  var pack = window.__marcoPack;
  if (pack && pack[key] !== undefined && pack[key] !== '') return pack[key];
  return (fallback !== undefined) ? fallback : key;
}
function bpCountryName(k) {
  var pack = window.__marcoPack;
  if (pack && pack['bp.country.' + k]) return pack['bp.country.' + k];
  return k;
}
function bpBroadCatName(bc) {
  return bpT('bp.broadCat.' + bc, bc);
}

function getParent(k) { return k.includes(' - ') ? k.split(' - ')[0] : null; }
function getSubName(k) {
  var cn = bpCountryName(k);
  if (cn !== k && cn.includes(' - ')) return cn.split(' - ')[1];
  return k.includes(' - ') ? k.split(' - ')[1] : k;
}
function getParentDisplay(p) {
  var cnNames = (window.__marcoPack) ? PARENT_NAMES_CN : {};
  return cnNames[p] || PARENT_NAMES[p] || p;
}
function getRegion(k) { const p = getParent(k) || k; return REGION_MAP[p] || 'Other'; }
function getISO(k) { const p = getParent(k) || k; return ISO_MAP[p] || ''; }
function getDisplayName(k) {
  var cn = bpCountryName(k);
  if (cn !== k && cn.includes(' - ')) return cn.split(' - ')[1];
  if (cn !== k) return cn;
  return k.includes(' - ') ? k.split(' - ')[1] : k;
}

var CN_BROAD_CAT_MAP = {
  '休假与带薪假期':'Leave','休假与请假':'Leave','育儿与家庭':'Leave',
  '健康与医疗':'Health & Insurance','工伤与保险':'Health & Insurance',
  '社会保障与保护':'Employment Protection',
  '退休与养老金':'Pension & Retirement',
  '奖金与法定付款':'Payments & Allowances','奖金与法定支付':'Payments & Allowances',
  '津贴 / 市场福利':'Payments & Allowances','津贴/市场福利':'Payments & Allowances',
  '其他员工福利':'Other',
  '离职补偿与服务终止':'Employment Protection','遣散与离职福利':'Employment Protection'
};
// New 10-category taxonomy from benefits-data.js collapsed into 5 broad filter groups.
var CATEGORY_TO_BROAD = {
  'Leave and Time Off':'Leave',
  'Parental, Family, and Child Benefits':'Leave',
  'Health and Medical':'Health & Insurance',
  'Work Injury and Occupational Protection':'Health & Insurance',
  'Disability, Life, Survivor, and Dependant Benefits':'Health & Insurance',
  'Retirement, Pension, and Long-Term Savings':'Pension & Retirement',
  'Bonuses and Statutory Payments':'Payments & Allowances',
  'Allowances and Common Employer Benefits':'Payments & Allowances',
  'Severance and End-of-Service Benefits':'Employment Protection',
  'Unemployment and Employment-Loss Protection':'Employment Protection'
};
function getBroadCat(cat) {
  if (CN_BROAD_CAT_MAP[cat]) return CN_BROAD_CAT_MAP[cat];
  if (CATEGORY_TO_BROAD[cat]) return CATEGORY_TO_BROAD[cat];
  return 'Other';
}

function getFilteredKeys() {
  const search = (document.getElementById('sidebarSearch').value || '').toLowerCase();
  const region = document.getElementById('regionFilter').value;
  return ALL_KEYS.filter(k => {
    if (search) {
      var cn = bpCountryName(k).toLowerCase();
      if (!k.toLowerCase().includes(search) && !cn.includes(search)) return false;
    }
    if (region && getRegion(k) !== region) return false;
    return true;
  });
}

function buildSidebar(filtered) {
  const list = document.getElementById('countryList');
  if (!filtered.length) { list.innerHTML = '<div class="sidebar-empty">' + bpT('bp.sidebar.empty', 'No results found') + '</div>'; return; }

  const groups = {};
  const singles = [];
  filtered.forEach(k => {
    const p = getParent(k);
    if (p) { if (!groups[p]) groups[p] = []; groups[p].push(k); }
    else singles.push(k);
  });

  const allItems = [
    ...Object.keys(groups).map(p => ({ type: 'group', key: p, sort: (PARENT_NAMES[p] || p) })),
    ...singles.map(s => ({ type: 'single', key: s, sort: s }))
  ].sort((a, b) => a.sort.localeCompare(b.sort));

  let html = '';
  allItems.forEach(item => {
    if (item.type === 'group') {
      const p = item.key;
      const children = groups[p].slice().sort((a, b) => {
        const aNat = getSubName(a) === 'National';
        const bNat = getSubName(b) === 'National';
        if (aNat && !bNat) return -1;
        if (bNat && !aNat) return 1;
        return a.localeCompare(b);
      });
      const isOpen = openGroups.has(p);
      html += `<div class="accordion-item">
        <div class="sb-row accordion-trigger${isOpen ? ' open' : ''}" data-group="${p}">
          <span class="sb-code">${getISO(p)}</span>
          <span class="sb-label">${getParentDisplay(p)}</span>
          <span class="sb-profiles">${children.length} state${children.length !== 1 ? 's' : ''}</span>
          <span class="sb-chevron">&#9662;</span>
        </div>
        <div class="accordion-panel${isOpen ? ' open' : ''}">
          ${children.map(c => `
            <div class="sb-row sub-item${currentKey === c ? ' active' : ''}" data-key="${c}">
              <span class="sb-code"></span>
              <span class="sb-label">${getSubName(c)}</span>
              <span class="sb-badge">${(BENEFITS[c]||[]).length}</span>
            </div>`).join('')}
        </div>
      </div>`;
    } else {
      const s = item.key;
      html += `<div class="accordion-item">
        <div class="sb-row${currentKey === s ? ' active' : ''}" data-key="${s}">
          <span class="sb-code">${getISO(s)}</span>
          <span class="sb-label">${bpCountryName(s)}</span>
          <span class="sb-badge">${(BENEFITS[s]||[]).length}</span>
        </div>
      </div>`;
    }
  });

  list.innerHTML = html;
}

function filterSidebar() { buildSidebar(getFilteredKeys()); }
function clearFilters() {
  document.getElementById('sidebarSearch').value = '';
  document.getElementById('regionFilter').value = '';
  buildSidebar(ALL_KEYS);
}

document.getElementById('countryList').addEventListener('click', function(e) {
  const row = e.target.closest('.sb-row');
  if (!row) return;
  if (row.classList.contains('accordion-trigger')) {
    const g = row.dataset.group;
    if (openGroups.has(g)) openGroups.delete(g); else openGroups.add(g);
    buildSidebar(getFilteredKeys());
  } else if (row.dataset.key) {
    currentKey = row.dataset.key;
    currentBroadCat = 'all';
    mobileCloseDrawer();
    buildSidebar(getFilteredKeys());
    renderDetail(currentKey);
  }
});

document.getElementById('mainContent').addEventListener('click', function(e) {
  const pill = e.target.closest('.cat-pill');
  if (!pill || !currentKey) return;
  currentBroadCat = pill.dataset.cat;
  renderDetail(currentKey);
});

function renderDetail(key) {
  const benefits = BENEFITS[key];
  if (!benefits) return;

  const displayName = getDisplayName(key);
  const parent = getParent(key);
  const region = getRegion(key);
  const metaParts = [];
  if (parent) metaParts.push(`<strong>${getParentDisplay(parent)}</strong>`);
  metaParts.push(region);
  metaParts.push(benefits.length + ' ' + bpT('bp.label.benefits', 'benefits'));

  const BROAD_ORDER = ['Leave','Health & Insurance','Pension & Retirement','Payments & Allowances','Employment Protection','Other'];
  const broadCount = {};
  benefits.forEach(b => { const bc = getBroadCat(b.category); broadCount[bc] = (broadCount[bc]||0)+1; });
  const presentCats = BROAD_ORDER.filter(c => broadCount[c]);

  let pillsHtml = `<div class="cat-pills">
    <span class="cat-pill${currentBroadCat==='all'?' active':''}" data-cat="all">${bpT('bp.region.all','All')} (${benefits.length})</span>`;
  presentCats.forEach(c => {
    pillsHtml += `<span class="cat-pill${currentBroadCat===c?' active':''}" data-cat="${c}">${bpBroadCatName(c)} (${broadCount[c]})</span>`;
  });
  pillsHtml += '</div>';

  const grouped = {};
  benefits.forEach(b => {
    const bc = getBroadCat(b.category);
    if (!grouped[bc]) grouped[bc] = {};
    if (!grouped[bc][b.category]) grouped[bc][b.category] = [];
    grouped[bc][b.category].push(b);
  });

  let contentHtml = '';
  BROAD_ORDER.forEach(bc => {
    if (!grouped[bc]) return;
    if (currentBroadCat !== 'all' && currentBroadCat !== bc) return;
    Object.keys(grouped[bc]).sort().forEach(rawCat => {
      contentHtml += `<div class="cat-group">
        <div class="cat-group-label">${escHtml(rawCat)}</div>
        ${grouped[bc][rawCat].map(b => renderBenefit(b)).join('')}
      </div>`;
    });
  });

  if (!contentHtml) contentHtml = '<div class="no-results">' + bpT('bp.label.noResults', 'No benefits in this category.') + '</div>';

  document.getElementById('mainContent').innerHTML = `
    <div class="detail-header">
      <div>
        <h1>${escHtml(displayName)}</h1>
        <div class="meta">${metaParts.join(' &middot; ')}</div>
      </div>
      <div class="benefit-count">${benefits.length}<span>${bpT('bp.label.benefits','benefits')}</span></div>
    </div>
    ${pillsHtml}
    <div id="benefitContent">${contentHtml}</div>`;
}

// Derive a short relationship badge label for a benefit row.
// National rows always get a "National" badge. Local/state rows get a label
// heuristically derived from the free-text nationalOrLocalVariation field:
// mentions of "additional" imply an extra local entitlement on top of the
// national one; mentions of "extend"/"extension" imply the national rule is
// simply extended/adapted locally; anything else falls back to a generic
// "Local Variation" label. No badge is shown when the field is empty or the
// literal "None identified." sentinel used in the source data.
function getRelationshipBadge(b) {
  if (b.location === 'National') return { label: bpT('bp.badge.national','National'), cls: 'badge-national' };
  const v = (b.nationalOrLocalVariation || '').trim();
  if (!v || v === 'None identified.') return null;
  const low = v.toLowerCase();
  if (low.includes('additional')) return { label: bpT('bp.badge.additional','Additional Local Entitlement'), cls: 'badge-local' };
  if (low.includes('extend') || low.includes('extension')) return { label: bpT('bp.badge.extension','Local Extension'), cls: 'badge-local' };
  return { label: bpT('bp.badge.variation','Local Variation'), cls: 'badge-local' };
}

function renderBenefit(b) {
  const mandMap = {'Yes':'tag-m-yes','No':'tag-m-no','Conditional':'tag-m-cond','Case-by-case':'tag-m-case','Jurisdiction-dependent':'tag-m-juris'};
  const mandClass = mandMap[b.mandatory] || 'tag-m-no';

  function block(label, value, full) {
    if (!value) return '';
    return `<div class="detail-block${full ? ' detail-full' : ''}"><div class="detail-label">${label}</div><div class="detail-value">${escHtml(value)}</div></div>`;
  }

  let detailsHtml = '';
  detailsHtml += block(bpT('bp.label.benefitStatus','Benefit Status'), b.benefitStatus, false);
  detailsHtml += block(bpT('bp.label.whoIsEligible','Who Is Eligible'), b.whoIsEligible, true);
  detailsHtml += block(bpT('bp.label.whatEmployeeReceives','What the Employee Receives'), b.whatEmployeeReceives, true);
  detailsHtml += block(bpT('bp.label.amountOrDuration','Amount or Duration'), b.amountOrDuration, false);
  detailsHtml += block(bpT('bp.label.whoPays','Who Pays'), b.whoPays, false);
  detailsHtml += block(bpT('bp.label.keyConditions','Key Conditions'), b.keyConditions, true);

  const summaryHtml = b.websiteSummary
    ? `<div class="benefit-summary">${escHtml(b.websiteSummary)}</div>` : '';

  const urls = (b.officialSourceURL || '').split('\n').map(s => s.trim()).filter(Boolean);
  const names = (b.officialSourceName || '').split(';').map(s => s.trim()).filter(Boolean);
  let sourcesHtml = '';
  if (urls.length) {
    sourcesHtml = '<div class="benefit-sources">' + urls.map((u, i) => {
      const label = names[i] || names[0] || bpT('bp.label.source','Source');
      return `<a href="${escHtml(u)}" target="_blank" rel="noopener">${escHtml(label)}</a>`;
    }).join(' &middot; ') + '</div>';
  }

  const verifiedHtml = b.lastVerified
    ? `<div class="benefit-verified">${bpT('bp.label.lastVerified','Last verified')}: ${escHtml(b.lastVerified)}</div>` : '';

  const badge = getRelationshipBadge(b);
  const badgeHtml = badge ? `<span class="relationship-badge ${badge.cls}">${badge.label}</span>` : '';

  return `<div class="benefit-card">
    <div class="benefit-header">
      <span class="benefit-name">${escHtml(b.benefitName)}</span>
      <span class="mandatory-tag ${mandClass}">${bpT('bp.label.mandatory','Mandatory')}: ${escHtml(b.mandatory||'—')}</span>
    </div>
    <div class="benefit-details">${detailsHtml}</div>
    <div class="benefit-footer">
      ${summaryHtml}
      ${sourcesHtml}
      ${verifiedHtml}
      ${badgeHtml}
    </div>
  </div>`;
}

function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mobileOpenDrawer() {
  document.getElementById('sidebar').classList.add('mobile-open');
  document.getElementById('sidebarOverlay').classList.add('active');
}
function mobileCloseDrawer() {
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sidebarOverlay').classList.remove('active');
}
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('expanded'); }

buildSidebar(ALL_KEYS);
</script>
<script src="assets/lang/lang-loader.js"></script>
<script>
document.addEventListener('marcolangready', function() {
  var pack = window.__marcoPack;
  if (!pack) return;
  if (pack['bp.data']) {
    var cnData = pack['bp.data'];
    Object.keys(cnData).forEach(function(k) { BENEFITS[k] = cnData[k]; });
  }
  ALL_KEYS = Object.keys(BENEFITS);
  buildSidebar(getFilteredKeys());
  if (currentKey) renderDetail(currentKey);
});
</script>
